# sonicexe.cfg - all optional. Lines starting with # are ignored.
fullscreen=1
# linear=1 gives smooth scaling (nicer on 480x320 screens), 0 = crisp pixels
linear=0
vsync=1
# print fps / room / instance count to log.txt every 2 s
fps=0
# max texture memory in MB (lower on 1 GB devices if you see crashes; pages reload on demand)
texbudget=160
# controller -> keyboard code (GameMaker vk codes: 32=space 13=enter 27=esc 88=X 90=Z 67=C 65=A 83=S 81=Q 69=E)
a=32
b=88
x=90
y=67
l1=65
r1=83
start=13
select=27

# analog stick dead zone (0-32767). Raise it if the stick drifts, lower it if it feels dull.
deadzone=14000

# --- controller troubleshooting ---
# Odroid-GO family pads ("GO-Advance Gamepad", "GO-Super Gamepad") are detected automatically:
# d-pad = buttons 10-13, L2/R2 = 6/7, Select = 8, Start = 9. Nothing to configure.
# Pressed buttons are logged to log.txt as "[input] ..." lines. If SDL's controller mapping for your pad is wrong,
# set rawpad=1 and give the raw joystick button numbers you saw in the log:
rawpad=0
#joy_a=1
#joy_b=0
#joy_start=9
#joy_select=8
# d-pads that report as buttons instead of a hat:
#joy_up=10
#joy_down=11
#joy_left=12
#joy_right=13
