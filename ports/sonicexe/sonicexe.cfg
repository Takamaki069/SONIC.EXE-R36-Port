# sonicexe.cfg - all optional. Lines starting with # are ignored.
fullscreen=1
# linear=1 gives smooth scaling (nicer on 480x320 screens), 0 = crisp pixels
linear=0
vsync=1
# print fps / room / instance count to log.txt every 2 s
fps=0
# max texture memory in MB (lower on 1 GB devices if you see crashes; pages reload on demand)
texbudget=160
# controller -> keyboard code (GameMaker vk codes: 32=space 13=enter 27=esc 88=X 90=Z 67=C 65=A 83=S 81=Q 69=E)
a=32
b=88
x=90
y=67
l1=65
r1=83
start=13
select=27

# analog stick dead zone (0-32767). Raise it if the stick drifts, lower it if it feels dull.
deadzone=14000

# name the game greets you with (it used to use your system user name, e.g. "ark")
name=player
# wrap long text (e.g. a long name on the "Ready for Round 2" screen) onto several lines instead of running off screen
wrap_text=0

# --- controller ---
# Raw joystick buttons are used by default (works on handhelds without SDL controller mappings).
# Defaults are the Odroid-GO Super layout: d-pad up/down/left/right = 8/9/10/11, Select = 12, Start = 13,
# L2/R2 = 6/7. Every pressed button is logged to log.txt as "[input] ..." so you can find your numbers.
# To use SDL's controller mapping instead (e.g. an Xbox pad): rawpad=0
rawpad=1
# Override any button by its raw number (setting any joy_* line disables the built-in defaults, so set them all):
#joy_a=0
#joy_b=1
#joy_start=13
#joy_select=12
#joy_up=8
#joy_down=9
#joy_left=10
#joy_right=11
